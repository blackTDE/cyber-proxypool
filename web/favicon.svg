<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="24,3 41,12 41,34 24,44 7,34 7,12" 
           stroke="url(#cyberGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
           fill="rgba(6, 9, 15, 0.85)" filter="url(#cyberGlow)"/>

  <!-- Inner Circuit Hex Grid -->
  <polygon points="24,8 36,15 36,31 24,38 12,31 12,15" 
           stroke="url(#cyberGrad)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.55" fill="none"/>

  <!-- Proxy Routing Nodes (Hex Vertices) -->
  <circle cx="24" cy="3" r="2" fill="#00f0ff"/>
  <circle cx="41" cy="12" r="2" fill="#00f0ff"/>
  <circle cx="41" cy="34" r="2" fill="#00ff9d"/>
  <circle cx="24" cy="44" r="2" fill="#00ff9d"/>
  <circle cx="7" cy="34" r="2" fill="#00ff9d"/>
  <circle cx="7" cy="12" r="2" fill="#00f0ff"/>

  <!-- Data Stream Routing Traces -->
  <path d="M24,8 L24,19" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M12,15 L20,22" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M36,15 L28,22" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M12,31 L20,26" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M36,31 L28,26" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M24,38 L24,29" stroke="url(#cyberGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Nexus Core (Quantum Ring) -->
  <circle cx="24" cy="24" r="5.5" stroke="url(#coreGrad)" stroke-width="2" fill="rgba(0, 255, 157, 0.15)"/>
  <circle cx="24" cy="24" r="2.5" fill="#00ff9d" filter="url(#cyberGlow)"/>

  <!-- Tech Corner Accent Flairs -->
  <line x1="17" y1="4" x2="31" y2="4" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="17" y1="43" x2="31" y2="43" stroke="#00ff9d" stroke-width="1.5" opacity="0.7"/>
</svg>
